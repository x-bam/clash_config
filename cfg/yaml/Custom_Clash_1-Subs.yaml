 # --- Regional Speed Measurement Strategy Group ---    
  - name: "🇭🇰 Hong Kong Node"
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|hk|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌)'
    use:
      - provider1
      
  - name: "🇩🇪 German Node"
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(German|Germany|德国|DE)'
    use:
      - provider1
      
  - name: "🇯🇵 Japan Node"
    type: url-test
    url: https://cp.cloudflare.com/generate_204
