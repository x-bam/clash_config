# OpenClash/Mihomo configuration merged from config-x-smart.ini and Custom_Clash.yaml.
# Proxy groups, rules, and external rule providers follow config-x-smart.ini.
# Provider settings and node filters follow Custom_Clash.yaml.
# Subscription URLs are injected by Custom_Clash_5Providers_merged.conf.
# Custom_OpenClash_Rules # OpenClash Dedicated Minimum YAML Configuration File (Standard Version) 
# Project Address: https://github.com/Aethersailor/Cust om_OpenClash_Rules 
# This file only defines node sources, static nodes, policy groups, rule providers and shunt rules. 
# Port, operating mode, DNS, IPv6, TUN, sniffing, GeoData, log and controller and other parameters are all managed by OpenClash LuCI. 
# It is recommended to complete the OpenClash settings according to the project Wiki first, and then load this configuration. 

# ==================== Proxy Provider ================= 
# provider1 is used to load airport subscriptions; multi-subscribers can be copied and named sequentially For provider2, provider3... 
# After adding Provider, you also need to add it to the use list of the relevant policy group.
proxy-providers:
  #provider1:
    #type: http
    #url: "url"  # Fill in the subscription link
    #interval: 3600  # Subscription update interval, unit: seconds
    #path: ./proxy_provider/provider1.yaml
    #proxy: DIRECT  # Strategies used when downloading subscriptions
    # Exclude non-node entries such as announcements, traffic, expiration, etc. at the Provider layer to avoid duplicate configuration of each policy group.
    #filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    #header:  # Optional: Custom HTTP request header
    #health-check:
      #enable: true
      #url: https://cp.cloudflare.com/generate_204
      #interval: 300
      #timeout: 5000
      #lazy: false
      #expected-status: 204
    #override:
      #udp: true
      # It is not recommended to skip TLS certificate verification by default; only enable it when it is clear that it needs to be compatible with a specific node.
      # skip-cert-verify: true
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
    
  provider1:
    type: http
    url: "url"
    interval: 3600
    path: ./proxy_provider/provider1.yaml
    proxy: DIRECT
    filter: '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$'
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true
      
