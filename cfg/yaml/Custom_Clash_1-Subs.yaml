    url: http://wifi.vivo.com.cn/generate_204
    proxies:
      - DIRECT    

# ==================== Shut rules Rules ==================== 
# The rules are matched from top to bottom, and stop after hitting the first rule. 
# no-resolve is used for IP rules to avoid additional triggering DNS resolution for rule matching.
      
rules:
  - "GEOSITE,private,🎯 Direct Connection"
  - "GEOIP,private,🎯 Direct Connection,no-resolve"
  - "RULE-SET,Custom_Direct_Domain,🎯 Direct Connection"
  - "RULE-SET,Custom_Direct_IP,🎯 Direct Connection,no-resolve"
  - "RULE-SET,Custom_Direct_Port,🎯 Direct Connection"
  - "GEOSITE,google-cn,🎯 Direct Connection"
  - "GEOSITE,category-games@cn,🎯 Direct Connection"
  - "RULE-SET,Steam_CDN_Domain,🎯 Direct Connection"
  - "RULE-SET,Steam_CDN_IP,🎯 Direct Connection,no-resolve"
  - "GEOSITE,category-game-platforms-download,🎯 Direct Connection"
  - "GEOSITE,category-public-tracker,🎯 Direct Connection"
  - "GEOSITE,category-communication,💬 MessagingApps"
  - "GEOIP,telegram,💬 MessagingApps,no-resolve"
  - "GEOSITE,github,📺 GitHub"
  - "GEOSITE,category-social-media-!cn,📱 SocialMedia"
  - "GEOIP,twitter,📱 SocialMedia,no-resolve"
  - "GEOIP,facebook,📱 SocialMedia,no-resolve"
  - "GEOSITE,reddit,🙋 Reddit"
  - "GEOSITE,category-ai-!cn,🤖 AI"
  - "GEOSITE,youtube,📹 YouTube"
  - "GEOSITE,apple,🍎 Apple"
  - "GEOSITE,apple-tvplus,🍎 Apple"
  - "GEOSITE,microsoft,Ⓜ️ Microsoft"
  - "GEOSITE,googlefcm,📢 Google FCM"
  - "GEOSITE,google,🇬 GoogleServices"
  - "GEOIP,google,🇬 GoogleServices,no-resolve"
  - "GEOSITE,netflix,🎥 Netflix"
  - "GEOIP,netflix,🎥 Netflix,no-resolve"
  - "GEOSITE,disney,🎥 DisneyPlus"
  - "GEOSITE,primevideo,🎥 PrimeVideo"
  - "GEOSITE,category-porn,🎥 XXX"
  - "RULE-SET,GermanTV,🇩🇪📺 GermanTV"
  - "GEOSITE,spotify,🎻 Spotify"
  - "GEOSITE,steam,🎮 Steam"
  - "GEOSITE,category-games,🎮 Gaming Platform"
  - "GEOSITE,category-entertainment,🌍 Foreign Media"
  - "GEOSITE,cn,🎯 Direct Connection"
  - "GEOIP,cn,🎯 Direct Connection,no-resolve"
  - "MATCH,🐟 Others"
  
# ==================== 规则提供者 Rule Providers ====================
# Domain/IP rules give priority to MRS; Classical YAML is used when including composite rules such as ports. 
# The update cycle is consistent with Custom_Clash.ini: 28,800 seconds (8 hours).

rule-providers: 
  Custom_Direct_Domain:
    behavior: domain
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs"
    format: mrs  

  Custom_Direct_IP:
    behavior: ipcidr
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.mrs"
    format: mrs

  Steam_CDN_Domain:
    behavior: domain
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.mrs"
    format: mrs

  Steam_CDN_IP:
    behavior: ipcidr
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_IP.mrs"
    format: mrs
  
  Custom_Direct_Port:
    behavior: classical
    interval: 28800
    type: http
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_Port.yaml"
    format: yaml
    
  GermanTV:
    type: http
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/x-bam/clash_config@main/ruleset/GermanTV.list"
    interval: 28800
